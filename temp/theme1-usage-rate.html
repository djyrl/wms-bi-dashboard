<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>主题一：领用指标 · 识别库存形成情况</title> -->
  <title>主题一</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
  <script>if(typeof echarts==='undefined'){var s=document.createElement('script');s.src='https://unpkg.com/echarts@5.5.0/dist/echarts.min.js';document.head.appendChild(s);}</script>
  <style>
    :root { --bg-deep:#0a0e17;--bg-panel:#111827;--border:#1e293b;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--accent-blue:#3b82f6;--accent-cyan:#06b6d4;--accent-green:#10b981;--accent-amber:#f59e0b;--accent-rose:#f43f5e;--accent-purple:#8b5cf6;--font-mono:'SF Mono','Fira Code','Cascadia Code',monospace; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg-deep);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
    .header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg-panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:14px}
    .logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent-rose),#f97316);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .title{font-size:18px;font-weight:700;color:var(--accent-rose)}
    .subtitle{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .header-right{display:flex;align-items:center;gap:24px}
    .stat-pill{display:flex;flex-direction:column;align-items:flex-end}
    .stat-pill .label{font-size:10px;color:var(--text-secondary);letter-spacing:1px}
    .stat-pill .value{font-size:16px;font-weight:700;font-family:var(--font-mono)}
    .section-row{display:flex;align-items:center;gap:12px;padding:24px 28px 8px}
    .section-num{width:32px;height:32px;border-radius:8px;background:var(--accent-rose);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
    .section-title{font-size:17px;font-weight:700}
    .section-desc{font-size:12px;color:var(--text-secondary);margin-left:4px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:10px 28px}
    .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
    .panel:hover{border-color:rgba(244,63,94,0.3)}
    .panel-header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.05)}
    .panel-header h3{font-size:13px;font-weight:600;flex:1}
    .panel-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
    .chart{flex:1;min-height:280px;width:100%}
    .data-section{max-height:130px;overflow-y:auto;flex-shrink:0;border-top:1px solid var(--border);font-size:10px;background:var(--bg-panel)}
    .data-section summary{cursor:pointer;padding:5px 12px;color:var(--text-secondary);user-select:none;position:sticky;top:0;background:var(--bg-panel);z-index:1}
    .data-section summary:hover{color:var(--text-primary)}
    .data-section table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:10px}
    .data-section th{position:sticky;top:0;background:var(--bg-panel);text-align:left;padding:4px 8px;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border)}
    .data-section td{padding:3px 8px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text-primary)}
    .data-section tr:hover td{background:rgba(244,63,94,0.05)}
    .data-section .num{text-align:right;font-feature-settings:"tnum"}
    @media(max-width:1024px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">📉</div>
    <div>
      <div class="title">主题一</div>
      <div class="subtitle">总体控制，发现库存异常增长信号</div>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-pill"><span class="label">领用率</span><span class="value" style="color:var(--accent-rose)">72.3%</span></div>
    <div class="stat-pill"><span class="label">刷新时间</span><span class="value" style="color:var(--accent-amber)" id="refresh-time">--</span></div>
  </div>
</div>

<div class="section-row">
  <span class="section-num">1</span>
  <span class="section-title" style="color:var(--accent-rose)">领用指标 · 识别库存形成情况</span>
  <span class="section-desc">总体控制，发现库存异常增长信号</span>
</div>

<div class="grid">
  <div class="panel">
    <div class="panel-header"><h3>📉 物资领用率月度趋势</h3><span style="font-size:10px;color:var(--text-secondary)">领用金额 / (期初库存+本期入库) × 100%</span></div>
    <div class="panel-body"><div class="chart" id="chart-usage-rate"></div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><h3>📦 入库金额 vs 领用金额 对比</h3><span style="font-size:10px;color:var(--text-secondary)">入库多、领用少 → 库存净增</span></div>
    <div class="panel-body"><div class="chart" id="chart-in-out"></div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><h3>📊 在库水位 · 安全库存偏离度</h3></div>
    <div class="panel-body"><div class="chart" id="chart-water-level"></div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><h3>⚠️ 库存异常变动预警日历</h3><span style="font-size:10px;color:var(--text-secondary)">单日入库/领用偏离均值2σ</span></div>
    <div class="panel-body"><div class="chart" id="chart-anomaly"></div></div>
  </div>
</div>

<script>
// ═══════════════ Shared ═══════════════
if(typeof echarts==='undefined'){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0e17;color:#e2e8f0;font-family:sans-serif"><h1>⚠️ ECharts 加载失败，请检查网络后刷新</h1></div>';throw new Error('ECharts not loaded')}
const $={rose:'#f43f5e',amber:'#f59e0b',purple:'#8b5cf6',green:'#10b981',blue:'#3b82f6',cyan:'#06b6d4',textSub:'#94a3b8',textPri:'#e2e8f0',border:'#1e293b',bgPanel:'#111827'};
function initChart(id){var dom=document.getElementById(id);if(!dom)return null;try{var c=echarts.init(dom,null,{devicePixelRatio:window.devicePixelRatio});new ResizeObserver(function(){c.resize()}).observe(dom);return c}catch(e){return null}}
function tip(){return{backgroundColor:'rgba(17,24,39,0.95)',borderColor:$.border,textStyle:{color:$.textPri,fontSize:12}}}
function sLine(){return{lineStyle:{color:'rgba(255,255,255,0.06)'}}}
function aLine(){return{lineStyle:{color:'rgba(255,255,255,0.15)'}}}
function fillData(chartId,headers,rows){var chart=document.getElementById(chartId);if(!chart)return;var panelBody=chart.closest('.panel-body');if(!panelBody)return;var ds=panelBody.querySelector('.data-section');if(!ds){ds=document.createElement('details');ds.className='data-section';ds.setAttribute('open','');ds.innerHTML='<summary>📊 数据明细</summary><div class="data-inner"></div>';panelBody.appendChild(ds)}var inner=ds.querySelector('.data-inner');if(!inner)return;var h='<table><thead><tr>';headers.forEach(function(hd){h+='<th>'+hd+'</th>'});h+='</tr></thead><tbody>';rows.forEach(function(row){h+='<tr>';row.forEach(function(cell,i){var cls=(i>0&&typeof cell==='number')?'num':'';h+='<td class="'+cls+'">'+cell+'</td>'});h+='</tr>'});h+='</tbody></table>';inner.innerHTML=h}

// ═══════════════ Data ═══════════════
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const CATEGORIES=['钢材','电缆','阀门','泵类','仪表','管件','紧固件','密封件','电器','轴承'];
const usageRateData=[85,83,81,80,79,77,76,74,73,72,71,72];
const usageRateTarget=[80,80,80,80,80,80,80,80,80,80,80,80];
const inAmountData=[420,380,450,520,480,510,560,490,530,550,470,500];
const outAmountData=[380,350,390,400,370,380,390,360,370,380,340,360];
const stockCurrent=[320,280,450,180,220,350,150,200,380,120];
const stockSafeMax=[250,200,300,150,180,250,120,160,280,100];
const stockSafeMin=[120,100,150,80,90,120,60,80,140,50];

console.log('📦 主题一：领用指标 · 数据已加载');

// ═══════════════ 1.1 领用率月度趋势 ═══════════════
(function(){
  var c=initChart('chart-usage-rate');
  var n=usageRateData.length,xs=usageRateData.map(function(_,i){return i});
  var yMean=usageRateData.reduce(function(a,b){return a+b},0)/n,xMean=(n-1)/2;
  var slope=xs.reduce(function(s,x,i){return s+(x-xMean)*(usageRateData[i]-yMean)},0)/xs.reduce(function(s,x){return s+(x-xMean)*(x-xMean)},0);
  var intercept=yMean-slope*xMean;
  var trendLine=usageRateData.map(function(_,i){return +(slope*i+intercept).toFixed(1)});
  c.setOption({
    tooltip:{...tip(),trigger:'axis'},
    legend:{top:0,textStyle:{color:$.textSub},data:['领用率','趋势线','目标线(80%)']},
    grid:{top:45,right:20,bottom:25,left:55},
    xAxis:{type:'category',data:MONTHS,axisLabel:{color:$.textSub,fontSize:10},axisLine:aLine()},
    yAxis:{type:'value',min:60,max:100,axisLabel:{color:$.textSub,formatter:'{value}%'},splitLine:sLine()},
    series:[
      {name:'领用率',type:'line',data:usageRateData,smooth:true,lineStyle:{color:$.rose,width:2.5},itemStyle:{color:$.rose},symbol:'circle',symbolSize:6,
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(244,63,94,0.25)'},{offset:1,color:'rgba(244,63,94,0)'}])},
        markLine:{silent:true,symbol:'none',data:[{yAxis:75,label:{formatter:'⚠ 预警线 75%',color:$.amber},lineStyle:{color:$.amber,type:'dashed',width:1.5}}]}},
      {name:'趋势线',type:'line',data:trendLine,smooth:false,lineStyle:{color:'#fbbf24',width:2,type:'dotted'},itemStyle:{color:'#fbbf24'},symbol:'none',
        endLabel:{show:true,formatter:'↓ 下降趋势',color:'#fbbf24',fontSize:11,fontWeight:'bold'}},
      {name:'目标线(80%)',type:'line',data:usageRateTarget,lineStyle:{color:$.green,width:1.5,type:'dashed'},itemStyle:{color:$.green},symbol:'none'},
    ],
  });
  fillData('chart-usage-rate',['月份','领用率(%)','目标(%)','趋势值(%)'],MONTHS.map(function(m,i){return[m,usageRateData[i],usageRateTarget[i],trendLine[i]]}));
})();

// ═══════════════ 1.2 入库 vs 领用 ═══════════════
(function(){
  var c=initChart('chart-in-out');
  var diff=inAmountData.map(function(v,i){return v-outAmountData[i]});
  c.setOption({
    tooltip:{...tip(),trigger:'axis'},
    legend:{top:0,textStyle:{color:$.textSub},data:['入库金额','领用金额','净增库存']},
    grid:{top:40,right:20,bottom:20,left:55},
    xAxis:{type:'category',data:MONTHS,axisLabel:{color:$.textSub,fontSize:10},axisLine:aLine()},
    yAxis:{type:'value',name:'万元',nameTextStyle:{color:$.textSub},axisLabel:{color:$.textSub},splitLine:sLine()},
    series:[
      {name:'入库金额',type:'bar',data:inAmountData,itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:$.blue},{offset:1,color:'rgba(59,130,246,0.2)'}])},barWidth:16,barGap:'30%'},
      {name:'领用金额',type:'bar',data:outAmountData,itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:$.cyan},{offset:1,color:'rgba(6,182,212,0.2)'}])},barWidth:16},
      {name:'净增库存',type:'line',data:diff,smooth:true,lineStyle:{color:$.amber,width:2},itemStyle:{color:$.amber},symbol:'triangle',symbolSize:8,
        markLine:{silent:true,symbol:'none',data:[{yAxis:0,label:{formatter:'平衡线'},lineStyle:{color:'rgba(255,255,255,0.3)'}}]}},
    ],
  });
  fillData('chart-in-out',['月份','入库(万)','领用(万)','净增(万)'],MONTHS.map(function(m,i){return[m,inAmountData[i],outAmountData[i],inAmountData[i]-outAmountData[i]]}));
})();

// ═══════════════ 1.3 库存水位 ═══════════════
(function(){
  var c=initChart('chart-water-level');
  c.setOption({
    tooltip:{...tip(),trigger:'axis'},
    legend:{top:0,textStyle:{color:$.textSub},data:['当前库存','安全上限','安全下限']},
    grid:{top:40,right:20,bottom:20,left:55},
    xAxis:{type:'category',data:CATEGORIES,axisLabel:{color:$.textSub,fontSize:9,rotate:30},axisLine:aLine()},
    yAxis:{type:'value',name:'万元',nameTextStyle:{color:$.textSub},axisLabel:{color:$.textSub},splitLine:sLine()},
    series:[
      {name:'当前库存',type:'bar',data:stockCurrent,itemStyle:{color:function(p){return stockCurrent[p.dataIndex]>stockSafeMax[p.dataIndex]?$.rose:$.blue}},barWidth:14},
      {name:'安全上限',type:'line',data:stockSafeMax,lineStyle:{color:$.rose,width:1,type:'dashed'},symbol:'none'},
      {name:'安全下限',type:'line',data:stockSafeMin,lineStyle:{color:$.amber,width:1,type:'dashed'},symbol:'none'},
    ],
  });
  fillData('chart-water-level',['物料类别','当前库存(万)','安全上限(万)','安全下限(万)','状态'],CATEGORIES.map(function(c,i){return[c,stockCurrent[i],stockSafeMax[i],stockSafeMin[i],stockCurrent[i]>stockSafeMax[i]?'⚠ 超限':stockCurrent[i]<stockSafeMin[i]?'⚠ 不足':'✅ 正常']}));
})();

// ═══════════════ 1.4 异常变动预警日历 ═══════════════
(function(){
  var c=initChart('chart-anomaly');
  var days=[],data=[],today=new Date();
  for(var i=29;i>=0;i--){var d=new Date(today);d.setDate(d.getDate()-i);days.push((d.getMonth()+1)+'/'+d.getDate());var r=Math.random();data.push(r>0.55?1:r>0.35?2:r>0.28?3:0)}
  c.setOption({
    tooltip:{...tip(),formatter:function(p){return p.name+'<br/>'+['✅ 正常','📦 入库异常偏高','📉 领用异常偏低','⚠️ 双异常'][p.value]}},
    grid:{top:10,right:20,bottom:20,left:20},
    xAxis:{type:'category',data:days,axisLabel:{color:$.textSub,fontSize:9,rotate:60},axisLine:aLine(),axisTick:{show:false}},
    yAxis:{type:'category',data:['异常类型'],axisLabel:{color:$.textSub},axisLine:{show:false},axisTick:{show:false}},
    visualMap:{show:false,pieces:[{value:0,color:'#1e293b'},{value:1,color:$.blue},{value:2,color:$.amber},{value:3,color:$.rose}]},
    series:[{type:'heatmap',data:data.map(function(v,i){return[i,0,v]}),
      label:{show:true,fontSize:9,formatter:function(p){return['✅','📦入库','📉领用','⚠️双异'][p.value[2]]},color:function(p){return p.value[2]===0?'rgba(255,255,255,0.25)':'#fff'}},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(255,255,255,0.3)'}}}],
  });
  var rows=[];for(var ai=0;ai<days.length;ai++){rows.push([days[ai],['✅ 正常','📦 入库异常','📉 领用异常','⚠️ 双异常'][data[ai]]])}
  fillData('chart-anomaly',['日期','状态'],rows);
})();

// Live timer
(function loop(){var now=new Date(),el=document.getElementById('refresh-time');if(el)el.textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');setTimeout(loop,1000)})();
</script>
</body>
</html>
