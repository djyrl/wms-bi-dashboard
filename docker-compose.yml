x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD_BASE64: ${DB_PASSWORD_BASE64}

services:
  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: nacos
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=nacos-mysql
      - MYSQL_SERVICE_DB_NAME=nacos_devtest
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=2222
      - NACOS_AUTH_IDENTITY_VALUE=2xxx
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
    volumes:
      - ${PWD}/nacos/logs/:/home/nacos/logs
    ports:
     #- "8080:8080"
      - "8848:8848"
      - "9848:9848"
    networks:
      - garden
    depends_on:
      nacos-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  nacos-mysql:
    container_name: nacos-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=nacos_devtest
      - MYSQL_USER=nacos
      - MYSQL_PASSWORD=nacos
      - LANG=C.UTF-8
    volumes:
      - ${PWD}/nacos/mysql:/var/lib/mysql
      - ${PWD}/nacos/mysql-init:/docker-entrypoint-initdb.d/
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "33068:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - garden

  garden-redis:
    image: redis:6.2.22
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - garden
    environment:
      - TZ=Asia/Shanghai

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  garden-wms-service:
    container_name: garden-wms-service
      #image: 192.168.92.240/garden/wms-service:latest
    image: 192.168.50.60:10180/garden/wms-service:latest
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
      garden-redis:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "19900:19900"
      - "10067:10067"
    networks:
      - garden
      - kingbase_network
    environment:
      - TZ=Asia/Shanghai
      - RUN_MODE=test
      - NACOS_ADDR=nacos:8848
      - NACOS_ACCOUNT=nacos
      - NACOS_PWD=nacos
      - JAVA_OPTS=-Xms1g -Xmx2g -javaagent:/app/data/ims-license-agent-all.jar
      - WMS_MIGRATION_ENABLED=true
      - WMS_COLLECTOR_SCHEDULER_ENABLED=false
      - WMS_TCP_SERVER_ENABLED=false
      - WMS_TCP_SERVER_PORT=10067
      - WMS_VOICE_ENABLED=true
      - WMS_DIGITAL_HUMAN_ENABLED=true
      - WMS_DIGITAL_HUMAN_BASE_URL=http://192.168.50.33:8000
      - WMS_SCALE_SOCKET_ENABLED=false
      - WMS_TASK_SCHEDULER_ENABLED=false
      - WMS_SMART_SHELF_ENABLED=false
      - WMS_REPORT_SCHEDULER_ENABLED=false
      - WMS_N8N_ENABLED=true
      - WMS_N8N_BASE_URL=http://192.168.50.33:8000
      - WMS_N8N_CONNECT_TIMEOUT=10
      - WMS_N8N_READ_TIMEOUT=30
      - LOG_PATH=/app/data/logs
      - WMS_VOICE_IDLE_SILENCE_TIMEOUT_MS=30000
      - WMS_VOICE_PLAYBACK_FORCE_TIMEOUT_MS=60000
      - WMS_LOCATION_INSTANT_STATUS_SYNC_ENABLED=false
      - WMS_VOICE_WEBSOCKET_ENABLED=true
      - WMS_VOICE_PROCESS_ENABLED=false
      - WMS_SESSION_NORMAL_TIMEOUT_MINUTES=1800
    volumes:
      - ./data:/app/data
      - ./logs/app:/app/data/logs

  garden-wms-fe-admin:
    container_name: garden-wms-fe-admin
      #image: 192.168.92.240/garden/wms-fe-admin:latest
    image: 192.168.50.60:10180/garden/wms-fe-admin:latest
    restart: unless-stopped
    networks:
      - garden
    environment:
      TZ: Asia/Shanghai
      VG_BASE_URL: ""

    depends_on:
      nginx:
        condition: service_healthy

  garden-wms-fe-webapp:
    container_name: garden-wms-fe-webapp
      #image: 192.168.92.240/garden/wms-fe-webapp:latest
    image: 192.168.50.60:10180/garden/wms-fe-webapp:latest
    restart: unless-stopped
    networks:
      - garden
    environment:
      TZ: Asia/Shanghai
      VG_BASE_URL: ""

    depends_on:
      nginx:
        condition: service_healthy

  bi-dashboard:
    image: bi-dashboard:latest
    container_name: wms-bi-api
    restart: unless-stopped
    ports:
      - "8088:5001"
    networks:
      - garden
      - kingbase_network
    environment:
      <<: *db-env
      STATIC_FOLDER: /app/static
      PYTHONUNBUFFERED: "1"
    command: ["python", "app.py"]

  nginx:
    image: nginx:1.31
    restart: unless-stopped
    ports:
      - "9900:9900"
      - "9901:9901"
    networks:
      - garden
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${PWD}/conf/garden.nginx.conf:/etc/nginx/conf.d/garden.nginx.conf
      - ${PWD}/logs/nginx:/var/log/nginx

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]

      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.2
    container_name: dev-rustfs
    user: "1000:1000"
    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_EXTERNAL_ADDRESS: ":9000"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_LOG_LEVEL: "info"
      TZ: "Asia/Shanghai"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./rustfs/data:/data
    networks:
      - garden
    restart: always

volumes:
  redis_data:
  s3fs:
  api_gateway_logs:
networks:
  garden:
    driver: bridge
  kingbase_network:
    external: true
    name: kingbase_default
